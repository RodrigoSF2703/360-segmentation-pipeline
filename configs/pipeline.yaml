# =========================
# EXTRAÇÃO DE VISTAS
# =========================
# Modos:
#   single       -> 1 vista (yaw + pitch escalares)
#   nadir_multi  -> N yaws com pitch fixo
#   grid         -> varredura por incrementos de yaw e pitch
mode: nadir_multi

fov: 90
output_size: [512, 512]

single:
  yaw: 0
  pitch: -85

nadir_multi:
  pitch: -85
  yaw_list: [0, 120, 240]

grid:
  yaw_step: 45
  pitch_step: 30

# =========================
# SEGMENTAÇÃO
# =========================
segmentation:
  prompt: "person on a motorcycle"
  box_threshold: 0.3
  text_threshold: 0.25

# =========================
# REPROJEÇÃO
# =========================
reprojection:
  fuse_threshold: 1

# =========================
# EXECUÇÃO (controle de batch)
# =========================
run:
  max_images: 300
  max_views: 15

# =========================
# REFINAMENTO
# =========================
refinement:
  enabled: true
  kernel_size: 5
  min_area: 500
  use_grabcut: false
  grabcut_iter: 5

# =========================
# TREINAMENTO (YOLOv8-seg)
# =========================
# Para GPU, troque device: 0. epochs/imgsz/batch ditam o tempo total.
training:
  base_model: yolov8n-seg.pt
  data_yaml: data/processed/yolo_dataset/data.yaml
  epochs: 90
  imgsz: 640
  batch: 16
  device: cpu
  patience: 20
  project: train_runs
  name: yolov8n_seg